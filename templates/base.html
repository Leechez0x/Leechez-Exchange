<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content-="width=device-width, initial-scale0=1.0">
        <title>Leechez Exchange</title>
        <style>
            * { margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body{
                 font-family: Arial, sans-serif;
                 background: #0d1117;
                 color: #ffffff;
            }

            nav {
                background: #161b22;
                padding: 1rem 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            nav .logo{
                font-size: 1.5rem;
                font-weight: bold;
                color: #f7931a;
            }

            nav a{
                color: #ffffff;
                text-decoration: none;
                margin-left: 1rem;
            }
            
            nav a:hover{
                color: #f7931a
            }

            .container {
                 max-width: 1100px;
                 margin: 0 auto;
                 padding: 2rem;
            }

        </style>
    </head>
    <body>
        <nav>
            <span class="logo">🪙 Leechez Exchange</span>
            <div>
                {% if session['user'] %}
                    <a href="/dashboard">Dashboard</a>
                    <a href="/logout">Logout</a>
                {% else %}
                    <a href="/">Home</a>
                    <a href="/login">Login</a>
                    <a href="/signup">Sign Up</a>
                {% endif %}
            </div>
        </nav>

        <div class="container">
            {% block content %}{% endblock %}
        </div>

    </body>
</html>
