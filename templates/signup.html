{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-bottom: 2rem; color: #f7931a;">Create Account</h2>

    {% if error %}
    <p style="color: red; text-align: center; margin-bottom: 1rem;">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/signup">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #8b949e;">Full Name</label>
            <input type="text" name="name" required style="
                width: 100%; padding: 0.75rem;
                background: #161b22; border: 1px solid #30363d;
                color: white; border-radius: 8px; font-size: 1rem;
            ">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #8b949e;">Email</label>
            <input type="email" name="email" required style="
                width: 100%; padding: 0.75rem;
                background: #161b22; border: 1px solid #30363d;
                color: white; border-radius: 8px; font-size: 1rem;
            ">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #8b949e;">Password</label>
            <input type="password" name="password" required style="
                width: 100%; padding: 0.75rem;
                background: #161b22; border: 1px solid #30363d;
                color: white; border-radius: 8px; font-size: 1rem;
            ">
        </div>
        <button type="submit" style="
            width: 100%; padding: 0.75rem;
            background: #f7931a; color: white;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer;">Create Account</button>
    </form>
    
    <p style="text-align: center; margin-top: 1rem; color: #8b949e;"> 
        Already have an account? <a href="/login" style="color: #f7931a;">Login</a>
    </p>
</div>
{% endblock %}
