{% extends 'base.html' %}
{% block content %}
<div style="padding: 2rem 0;">
    <h2 style="color: #f7931a; margin-bottom: 0.5rem;">Welcome back, {{ username }}! 👋</h2>
    <p style="color: #8b949e; margin-bottom: 2rem;">Here's your crypto portfolio</p>

    <!-- Live Prices Section -->
    <div style="margin-bottom: 3rem;">
        <h3 style="margin-bottom: 1rem; color: #c9d1d9;">📈 Live Prices</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            {% for coin in prices %}
            <div style="background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 1.5rem;">
                <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">{{ coin.icon }}</div>
                <div style="font-weight: bold; font-size: 1.1rem;">{{ coin.name }}</div>
                <div style="color: #f7931a; font-size: 1.3rem; margin-top: 0.5rem;">${{ coin.price }}</div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Logout -->
    <a href="/logout" style="color: #8b949e; text-decoration: none;">Logout →</a>
</div>
{% endblock %}
